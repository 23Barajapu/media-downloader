<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .url-input {
            width: 100%;
            padding: 0.875rem 5.5rem 0.875rem 1rem;
            background-color: #0f172a;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .url-input:focus {
            border-color: var(--primary);
        }

        .url-input::placeholder {
            color: var(--text-muted);
        }

        .paste-btn {
            position: absolute;
            right: 0.5rem;
            background-color: #334155;
            border: none;
            border-radius: 6px;
            color: var(--text-main);
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .paste-btn:hover {
            background-color: #475569;
        }

        .format-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .format-option {
            padding: 0.875rem;
            background-color: #0f172a;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .format-option.active {
            border-color: var(--primary);
            background-color: rgba(99, 102, 241, 0.1);
            color: var(--text-main);
        }

        select {
            width: 100%;
            padding: 0.875rem 1rem;
            background-color: #0f172a;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-container {
            margin-top: 1.5rem;
            display: none;
            background-color: #0f172a;
            border-radius: 10px;
            padding: 1.25rem;
            border: 1px solid var(--border-color);
        }

        .progress-bar-outer {
            width: 100%;
            height: 8px;
            background-color: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .status-message {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .status-message.success { color: var(--success); }
        .status-message.error { color: var(--error); }

        .btn-download {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 0.85rem;
            background-color: var(--success);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 1rem;
            transition: opacity 0.2s ease;
        }

        .btn-download:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Universal Media Downloader</h1>
                <p class="subtitle">Unduh video dan audio dari berbagai platform dengan cepat dan mudah.</p>
            </div>

            <div class="form-group">
                <label for="urlInput">Link / URL Media</label>
                <div class="input-wrapper">
                    <input type="url" id="urlInput" class="url-input" placeholder="Tempel tautan video di sini..." required>
                    <button id="pasteBtn" type="button" class="paste-btn">Tempel</button>
                </div>
            </div>

            <div class="form-group">
                <label>Format File</label>
                <div class="format-selector">
                    <div class="format-option active" data-type="video">Video (MP4)</div>
                    <div class="format-option" data-type="audio">Audio (MP3)</div>
                </div>
            </div>

            <div class="form-group">
                <label for="qualitySelect">Pilihan Kualitas</label>
                <select id="qualitySelect">
                    <option value="best" selected>Kualitas Terbaik</option>
                    <option value="1080">Full HD (1080p)</option>
                    <option value="720">HD (720p)</option>
                    <option value="480">Standar (480p)</option>
                </select>
            </div>

            <button id="downloadBtn" class="btn-submit" type="button">Unduh Media</button>

            <div id="statusContainer" class="status-container">
                <div class="progress-bar-outer">
                    <div id="progressBar" class="progress-bar-inner"></div>
                </div>
                <div id="statusMessage" class="status-message">Menyiapkan...</div>
                <a id="downloadLink" href="#" class="btn-download" style="display: none;" target="_blank">Simpan File Unduhan</a>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const pasteBtn = document.getElementById('pasteBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const formatOptions = document.querySelectorAll('.format-option');
        const qualitySelect = document.getElementById('qualitySelect');
        const statusContainer = document.getElementById('statusContainer');
        const progressBar = document.getElementById('progressBar');
        const statusMessage = document.getElementById('statusMessage');
        const downloadLink = document.getElementById('downloadLink');

        let selectedFormat = 'video';

        formatOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                formatOptions.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                selectedFormat = opt.dataset.type;

                if (selectedFormat === 'audio') {
                    qualitySelect.innerHTML = `
                        <option value="320">Ultra High (320 kbps)</option>
                        <option value="192" selected>Kualitas Tinggi (192 kbps)</option>
                        <option value="128">Standar (128 kbps)</option>
                    `;
                } else {
                    qualitySelect.innerHTML = `
                        <option value="best" selected>Kualitas Terbaik</option>
                        <option value="1080">Full HD (1080p)</option>
                        <option value="720">HD (720p)</option>
                        <option value="480">Standar (480p)</option>
                    `;
                }
            });
        });

        pasteBtn.addEventListener('click', async () => {
            if (urlInput.value.trim()) {
                urlInput.value = '';
                pasteBtn.innerText = 'Tempel';
            } else {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        urlInput.value = text.trim();
                        pasteBtn.innerText = 'Hapus';
                    }
                } catch (e) {}
            }
        });

        urlInput.addEventListener('input', () => {
            pasteBtn.innerText = urlInput.value.trim() ? 'Hapus' : 'Tempel';
        });

        downloadBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url) {
                alert('Silakan masukkan URL media terlebih dahulu.');
                return;
            }

            downloadBtn.disabled = true;
            statusContainer.style.display = 'block';
            progressBar.style.width = '35%';
            statusMessage.className = 'status-message';
            statusMessage.innerText = 'Memproses unduhan media...';
            downloadLink.style.display = 'none';

            try {
                const res = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, format: selectedFormat, quality: qualitySelect.value })
                });

                const data = await res.json();
                if (res.ok && data.status === 'success') {
                    progressBar.style.width = '100%';
                    statusMessage.className = 'status-message success';
                    statusMessage.innerText = 'Unduhan berhasil diproses!';
                    if (data.download_url) {
                        downloadLink.href = data.download_url;
                        downloadLink.style.display = 'block';
                    }
                } else {
                    progressBar.style.width = '0%';
                    statusMessage.className = 'status-message error';
                    statusMessage.innerText = data.message || 'Gagal mengunduh media.';
                }
            } catch (err) {
                progressBar.style.width = '0%';
                statusMessage.className = 'status-message error';
                statusMessage.innerText = 'Gagal terhubung ke server.';
            } finally {
                downloadBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
